[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "End-to-end trading strategy platform backend (Zerodha Kite Connect)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "certifi>=2024.2.2",
    "python-jose[cryptography]>=3.3",
    "cryptography>=43.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "numpy>=2.0",
    "orjson>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
# E501: line length handled by formatter, not worth failing CI over.
# UP042: str+Enum (not StrEnum) is deliberate here for broad compatibility
#        with json/pydantic serialization behaviour we rely on.
# B027: on_start/on_stop are intentionally optional no-op hooks on
#       BaseStrategy, not abstract — most strategies don't need them.
# UP046: Generic[ModelT] base kept for runtime isinstance/typing clarity.
# B008: FastAPI's Depends()-as-default is the framework's own idiom.
ignore = ["E501", "UP042", "B027", "UP046", "B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
